# CI for tap-plugin-github-core.
#
# A thin caller. All the logic lives in the reusable workflow in the core TAP repo
# (`.github/workflows/plugin-ci.yml`, req-plugin-extdev-repo-ci) so every plugin repo —
# ours and external developers' — runs the SAME admission gate, and improving it is one
# edit in one place rather than a fan-out across a dozen repos.
#
# Since 2026-08-08 core is PUBLIC on the unified-systems-com org, which removed both of
# the old silent-failure prerequisites: public reusable workflows are callable from any
# repo (no Actions access_level sharing needed), and core can be checked out with no
# credential at all. `harness_pat` is still plumbed through for now — retiring
# TAP_CORE_RO_PAT is a separate, deliberate step — but a missing/expired value is no
# longer fatal to checkout.
#
# `boot_profile` is intentionally omitted: the Django-free conformance job (structure +
# requires_tap compatibility floor) is the gate here. A plugin that needs a real stack
# ships a ci/nightly.boot.json and passes boot_profile to opt into the boot-and-test job
# (see tap-plugin-samsite / tap-plugin-aws-core for the worked example).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs matter for a plugin repo: core can regress the plugin without a single
  # commit landing HERE, and nothing else would re-run this gate before the nightly.
  workflow_dispatch:

# Explicit least-privilege GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  tap:
    # SHA-pinned, matching ai-review.yml and ai-review-capture.yml in this directory.
    # `harness_ref` selects the harness CODE that gets checked out; THIS selects the
    # workflow DEFINITION — which steps run, which secrets reach them, how boot_profile
    # is interpreted. Pinning the former and not the latter, as this file did until now,
    # pins the smaller of the two. Bump deliberately; a gate improvement upstream does
    # not reach this repo until someone reviews and bumps it, which is the trade.
    uses: unified-systems-com/tap/.github/workflows/plugin-ci.yml@2f0ec95393b73266bb52f8ff6af6f3f09f6889ff # core main 2026-08-28
    with:
      plugin_slug: github_core
      # A full commit SHA, not a branch. The old value was `main` under a comment
      # claiming it was "pinned deliberately" — which it was not: a branch moves, and
      # this input selects the harness code that EXECUTES here. That was tolerable while
      # the job only ran Django-free structure validation; enabling the boot leg below
      # makes the same ref build an image and stand up a stack.
      # Bump this on purpose, to a reviewed SHA.
      harness_ref: 2f0ec95393b73266bb52f8ff6af6f3f09f6889ff # core main 2026-08-28
      # Opt into the boot-and-test leg. Without it this repo's OWN tests never execute
      # in its own gate: the conformance job is Django-free structure validation, so a
      # test importing a core module — or asserting anything about collection — is not
      # run by CI at all. PR #5 added exactly such a test and CI never executed it; it
      # was verified by hand. A gate that cannot run the suite is not yet the gate.
      boot_profile: ci/nightly.boot.json
    # NO secrets passed. TAP_CORE_RO_PAT existed to read core while it was PRIVATE; core
    # went public on 2026-08-08 and the harness workflow falls back to `github.token`,
    # which can read a public repo anonymously. Passing it was vestigial — and it was the
    # premise of every "executes beside a repository secret" finding on this PR. Removing
    # it dissolves that class rather than mitigating it. Retiring the secret org-wide is a
    # separate, deliberate step (core's plugin-ci.yml says so); this drops one caller's use.
