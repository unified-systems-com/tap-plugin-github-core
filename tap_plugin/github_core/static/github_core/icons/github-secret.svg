<?xml version="1.0" encoding="UTF-8"?>
<!-- Original glyph. An Actions secret: the lock body carries three dots, not characters —
     this node holds the NAME of a secret and never its value, and the icon says so. -->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24">
  <title>GitHub Actions Secret</title>
  <path fill="none" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" d="M8.1 10.2V7.4a3.9 3.9 0 0 1 7.8 0v2.8"/>
  <rect x="4.6" y="10.2" width="14.8" height="9.6" rx="2" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <circle cx="8.3" cy="15" r="1.15" fill="#1f2328"/>
  <circle cx="12" cy="15" r="1.15" fill="#1f2328"/>
  <circle cx="15.7" cy="15" r="1.15" fill="#1f2328"/>
</svg>
