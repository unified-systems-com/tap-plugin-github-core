manifest_version = "0"
plugin_version = "0.10.0"
requires_tap = ">=0.1.5"
slug = "github_core"
name = "TAP GitHub Core"
description = "GitHub Actions models — the pipeline as declared (workflows, jobs, rulesets, environments) and as run (runs, jobs, runners, caches) — and what it produces (releases, artifacts, packages)."

depends_on = [
    { slug = "git_core", note = "The neutral Git vocabulary (github-core#76): the collector mints git_core__git_repository / git_ref / git_commit through tap_plugin.git_core.identity and targets those types from DECLARES_REF-adjacent edges (PROTECTS, SCOPED_TO_REF, EVALUATED_ON_REF, TARGETS_REF) and from commit_observation." },
    { slug = "identity_core", note = "ENABLED_ON_REPOSITORY sources the identity_core__oidc_issuer type; the collector mints the issuer node via identity_core.issuer (the OIDC vocabulary lives there, not here)." },
    { slug = "compliance_core", note = "The neutral finding substrate: the collector mints compliance_core__compliance_finding for every scanner alert (code scanning first; Dependabot and secret scanning ride the same shape) and places it with CARRIES_COMPLIANCE_FINDING; the source-specific detail node (code_scanning_alert) hangs off it via DETAILS_FINDING. Vocabulary + type dependency, downward-only." },
]

